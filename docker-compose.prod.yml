# Entorno de PRODUCCION Docker Compose de MathMind AI (MVP test AWS).
# Ver docs/DEPLOY_AWS_FREE_TIER.md.
# A diferencia de docker-compose.yml (desarrollo: bind mounts + tsx watch), aqui no hay
# montajes de codigo del host: imagenes construidas + volumenes persistentes nombrados.
# Excepcion: ./rag/{input,history} en el servicio `backend` (material a ingerir por
# `npm run ingest:rag`, UC-011) -- no es codigo, es contenido que cambia sin republicar imagen.
# En EC2 free tier (t2.micro) se despliega con `docker compose -f docker-compose.prod.yml up -d --build`.

name: mathmindia-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mathmindia-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathmind}
      POSTGRES_DB: ${POSTGRES_DB:-mathmindia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mathmindia

  redis:
    image: redis:7-alpine
    container_name: mathmindia-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mathmindia

  backend:
    # Imagen construida y publicada por GitHub Actions (job `deploy`, ver .github/workflows/
    # e2e.yml) desde docker/node/Dockerfile.prod. Nunca se construye en la propia t3.micro
    # (1 GiB RAM insuficiente para compilar el monorepo); aqui solo se hace pull.
    image: ghcr.io/raomg-ia/mathmindia-backend:latest
    container_name: mathmindia-prod-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mathmind}:${POSTGRES_PASSWORD:-mathmind}@postgres:5432/${POSTGRES_DB:-mathmindia}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      # JWT_SECRET obligatorio: sin valor main.ts aborta (ADR-012). En produccion se
      # inyecta desde .env (nunca default de dev).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio en produccion}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RAG_INPUT_DIR: ${RAG_INPUT_DIR:-}
      RAG_HISTORY_DIR: ${RAG_HISTORY_DIR:-}
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      # Material de ingesta RAG (UC-011, npm run ingest:rag) -- rutas relativas al directorio
      # del compose file (/opt/mathmindia). El bootstrap (cloudformation.yml/user-data.sh) crea
      # estos directorios y su grupo compartido mathmindia-rag (root + ec2-user, setgid) --
      # no hace falta crearlos a mano salvo en una instancia provisionada antes de ese cambio.
      - ./rag/input:/workspace/rag/input
      - ./rag/history:/workspace/rag/history
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - mathmindia

  mobile-web:
    # Build web de Expo (apps/mobile-app) construido y publicado por GitHub Actions
    # (job `deploy`, ver .github/workflows/e2e.yml) desde docker/mobile-web/Dockerfile.prod.
    # EXPO_PUBLIC_API_BASE_URL queda fijado en build time dentro del bundle -- si cambia
    # el Elastic IP hay que reconstruir/publicar la imagen, no basta con recrear el contenedor.
    image: ghcr.io/raomg-ia/mathmindia-mobile-web:latest
    container_name: mathmindia-prod-mobile-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:8081:8081"
    healthcheck:
      # node:22-slim no trae wget/curl (verificado: a diferencia de node:22 completo, que
      # usa el backend) -- se comprueba con node puro, ya presente en la imagen.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8081/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - mathmindia

volumes:
  pgdata:
  redisdata:

networks:
  mathmindia:
    driver: bridge
